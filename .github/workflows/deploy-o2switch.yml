name: Deploy o2switch (SSH)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-o2switch
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check server.o2switch.js

  deploy:
    name: Deploy via SSH
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node for archive sanity check
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Validate secrets (diagnostic - ne leak jamais les valeurs)
        run: |
          echo "Host: $([ -n '${{ secrets.O2SWITCH_HOST }}' ] && echo SET || echo MISSING)"
          echo "User: $([ -n '${{ secrets.O2SWITCH_USER }}' ] && echo SET || echo MISSING)"
          echo "Password: $([ -n '${{ secrets.O2SWITCH_PASSWORD }}' ] && echo SET || echo EMPTY - normal si cle SSH sans password cPanel)"
          echo "SSH_KEY: $([ -n '${{ secrets.O2SWITCH_SSH_KEY }}' ] && echo SET || echo EMPTY - normal si auth par password)"
          echo "SSH_PASSPHRASE: $([ -n '${{ secrets.O2SWITCH_SSH_PASSPHRASE }}' ] && echo SET || echo EMPTY - requis seulement si cle chiffre)"
          echo "Port: ${{ secrets.O2SWITCH_PORT || '22 (default)' }}"
          echo "Path: ${{ secrets.O2SWITCH_PATH || 'MISSING !' }}"
          echo "NodeVenv: ${{ secrets.O2SWITCH_NODEVENV || '(vide - fallback auto)' }}"
          if [ -z "${{ secrets.O2SWITCH_HOST }}" ] || [ -z "${{ secrets.O2SWITCH_USER }}" ] || [ -z "${{ secrets.O2SWITCH_PATH }}" ]; then
            echo "::error::O2SWITCH_HOST / O2SWITCH_USER / O2SWITCH_PATH manquants - GitHub > Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.O2SWITCH_PASSWORD }}" ] && [ -z "${{ secrets.O2SWITCH_SSH_KEY }}" ]; then
            echo "::error::Ni O2SWITCH_PASSWORD ni O2SWITCH_SSH_KEY defini - configure l'un des deux (password = mot de passe cPanel le plus simple sur o2switch)"
            exit 1
          fi
          # Format HOST : doit etre IP ou hostname NU sans https:// ni :port ni /
          HOST='${{ secrets.O2SWITCH_HOST }}'
          if echo "$HOST" | grep -qE '^https?://|/|:'; then
            echo "::error::O2SWITCH_HOST='$HOST' invalide - mets IP nue (109.234.167.160) ou hostname nu (s109.o2switch.net) SANS https:// ni :port ni /"
            exit 1
          fi
          if echo "$HOST" | grep -q ' '; then
            echo "::error::O2SWITCH_HOST contient un espace - supprime l'espace dans le Secret"
            exit 1
          fi

      - name: Check DNS (diagnose no such host)
        run: |
          HOST='${{ secrets.O2SWITCH_HOST }}'
          echo "nslookup $HOST ..."
          if ! nslookup "$HOST" 2>&1; then
            echo "::warning::nslookup echoue - host non resolvable depuis GitHub runner"
            getent hosts "$HOST" 2>&1 || echo "::error::DNS FAIL - verifie O2SWITCH_HOST dans cPanel > General Information > Shared IP / Server Name"
          fi
          echo "nc -zv test (port ${{ secrets.O2SWITCH_PORT || 22 }}) ..."
          timeout 8 bash -c "cat < /dev/null > /dev/tcp/$HOST/${{ secrets.O2SWITCH_PORT || 22 }}" && echo "TCP OK" || echo "::warning::TCP connect echoue - firewall o2switch bloque peut-etre le port ${{ secrets.O2SWITCH_PORT || 22 }} (o2switch mutualise bloque souvent le 22, utilise FTP port 21)"

      # 1) Copie fichiers vers o2switch en SCP (sans node_modules/database.db/.env)
      # DIAGNOSTIC TON LOG 16:26 :
      #   - "no key found" = O2SWITCH_SSH_KEY est defini mais VIDE ou NON-PEM (pas de -----BEGIN...). La presence d'une cle invalide fait echouer meme si password est bon.
      #   - "dial tcp ... i/o timeout" = port/host injoignable depuis GitHub (firewall CSF o2switch ou mauvais O2SWITCH_PORT).
      # FIX IMMEDIAT : supprime O2SWITCH_SSH_KEY + O2SWITCH_SSH_PASSPHRASE si tu veux auth par password (recommande o2switch).
      # Si tu veux garder la cle : mets la cle PRIVEE complete (-----BEGIN OPENSSH PRIVATE KEY----- ... -----END...) SANS passphrase, ou avec passphrase + O2SWITCH_SSH_PASSPHRASE.
      - name: SCP to o2switch
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          passphrase: ${{ secrets.O2SWITCH_SSH_PASSPHRASE }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          source: "server.js,server.o2switch.js,package.json,package-lock.json,public/**,.htaccess,ecosystem.config.example.js"
          target: "${{ secrets.O2SWITCH_PATH }}"
          overwrite: true
          strip_components: 0
          rm: false
          timeout: 60s
          command_timeout: 10m
          debug: true

      # 2) Sur le serveur : npm ci + restart Passenger
      - name: SSH - install & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          passphrase: ${{ secrets.O2SWITCH_SSH_PASSPHRASE }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            echo ">> PATH=${{ secrets.O2SWITCH_PATH }}"
            echo ">> NODEVENV=${{ secrets.O2SWITCH_NODEVENV }}"
            # Active l'env Node de l'app (obligatoire o2switch)
            if [ -n "${{ secrets.O2SWITCH_NODEVENV }}" ] && [ -f "${{ secrets.O2SWITCH_NODEVENV }}/bin/activate" ]; then
              source "${{ secrets.O2SWITCH_NODEVENV }}/bin/activate"
            elif [ -f "$HOME/nodevenv/${{ secrets.O2SWITCH_PATH }}/22/bin/activate" ]; then
              source "$HOME/nodevenv/${{ secrets.O2SWITCH_PATH }}/22/bin/activate"
            elif [ -f "/opt/alt/alt-nodejs22/enable" ]; then
              source /opt/alt/alt-nodejs22/enable
            fi
            node -v
            npm -v
            cd "${{ secrets.O2SWITCH_PATH }}"
            mkdir -p "$HOME/acsc-data"
            # Ne jamais ecraser la DB prod si elle est liee via DB_PATH
            npm ci --omit=dev
            mkdir -p tmp
            touch tmp/restart.txt
            echo ">> restart.txt touche - Passenger va redemarrer (10-20s)"
            # Alternative cPanel si dispo (ne bloque pas si echec)
            if command -v cloudlinux-selector >/dev/null 2>&1; then
              cloudlinux-selector restart --json --interpreter nodejs --app-root "$HOME/${{ secrets.O2SWITCH_PATH }}" || true
            fi
            sleep 3
            curl -sk https://127.0.0.1:${PORT:-3000}/api/health || curl -sk https://localhost:${PORT:-3000}/api/health || echo "health local skip"
            echo "Deploy OK - teste https://${{ secrets.O2SWITCH_HOST }}/api/health depuis l'exterieur"

