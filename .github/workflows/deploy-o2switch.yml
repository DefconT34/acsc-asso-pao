name: Deploy o2switch (FTP)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-o2switch
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check server.o2switch.js

  deploy:
    name: Deploy via FTP
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node for archive sanity check
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Validate secrets
        run: |
          echo "Host: $([ -n '${{ secrets.O2SWITCH_HOST }}' ] && echo SET || echo MISSING)"
          echo "User: $([ -n '${{ secrets.O2SWITCH_USER }}' ] && echo SET || echo MISSING)"
          echo "Password: $([ -n '${{ secrets.O2SWITCH_PASSWORD }}' ] && echo SET || echo MISSING)"
          echo "Port: ${{ secrets.O2SWITCH_PORT || '21 (FTP default)' }}"
          echo "Path: ${{ secrets.O2SWITCH_PATH || 'MISSING !' }}"
          echo "NodeVenv: ${{ secrets.O2SWITCH_NODEVENV || '(vide)' }}"
          if [ -z "${{ secrets.O2SWITCH_HOST }}" ] || [ -z "${{ secrets.O2SWITCH_USER }}" ] || [ -z "${{ secrets.O2SWITCH_PATH }}" ]; then
            echo "::error::O2SWITCH_HOST / USER / PATH manquants"
            exit 1
          fi
          HOST='${{ secrets.O2SWITCH_HOST }}'
          if echo "$HOST" | grep -qE '^https?://|/|:'; then
            echo "::error::HOST invalide - mets IP nue (109.234.167.160) ou hostname nu SANS https:// ni :port"
            exit 1
          fi

      - name: Check DNS & FTP reachability
        run: |
          HOST='${{ secrets.O2SWITCH_HOST }}'
          echo "nslookup $HOST ..."
          nslookup "$HOST" 2>&1 || echo "::warning::DNS fail - verifie cPanel Shared IP"
          echo "TCP test $HOST:21 ..."
          timeout 8 bash -c "cat < /dev/null > /dev/tcp/$HOST/21" && echo "TCP 21 OK" || echo "::warning::TCP 21 fail - verifie HOST/PORT"
          echo "TCP test $HOST:22 ..."
          timeout 8 bash -c "cat < /dev/null > /dev/tcp/$HOST/22" && echo "TCP 22 OK" || echo "TCP 22 ferme - normal sur mutualise"

      - name: Prepare restart marker
        run: |
          mkdir -p tmp
          date -u > tmp/restart.txt
          cat tmp/restart.txt

      - name: Ensure .htaccess exists locally (fix CloudLinux FileNotFoundError)
        run: |
          ls -la .htaccess public/.htaccess || true
          # Le selector CloudLinux exige public/.htaccess (file_readlines) avant restart
          if [ ! -f public/.htaccess ]; then
            echo "WARN: public/.htaccess manquant localement -> creation minimale"
            mkdir -p public
            printf '%s\n' '# cPanel CloudLinux NodeJS selector - NE PAS SUPPRIMER' 'DirectoryIndex disabled' 'RewriteEngine On' > public/.htaccess
          fi
          cat public/.htaccess
          cat .htaccess || true
          echo "--- git tracked ---"
          git ls-files | grep -E "htaccess" || echo "aucun htaccess tracke (anomalie)"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: ${{ secrets.O2SWITCH_PATH }}/
          log-level: verbose
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/database.db
            **/database.db-*
            **/.env
            **/*.log
            **/acsc-asso-pao-v*.zip
            **/verify_*.js
            **/test_live.js
            **/O2SWITCH_ODISSEY.txt
            **/.ftp-deploy-sync-state.json

      - name: SSH install best-effort
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          passphrase: ${{ secrets.O2SWITCH_SSH_PASSPHRASE }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 15s
          command_timeout: 5m
          script: |
            set -e
            echo ">> PATH=${{ secrets.O2SWITCH_PATH }}"
            if [ -n "${{ secrets.O2SWITCH_NODEVENV }}" ] && [ -f "${{ secrets.O2SWITCH_NODEVENV }}/bin/activate" ]; then
              source "${{ secrets.O2SWITCH_NODEVENV }}/bin/activate"
            elif [ -f "$HOME/nodevenv/${{ secrets.O2SWITCH_PATH }}/22/bin/activate" ]; then
              source "$HOME/nodevenv/${{ secrets.O2SWITCH_PATH }}/22/bin/activate"
            elif [ -f "/opt/alt/alt-nodejs22/enable" ]; then
              source /opt/alt/alt-nodejs22/enable
            fi
            node -v || echo "node not found"
            npm -v || echo "npm not found"
            cd "${{ secrets.O2SWITCH_PATH }}"
            mkdir -p public
            if [ ! -f public/.htaccess ]; then
              echo "[FIX] public/.htaccess manquant -> creation (FileNotFoundError cl-selector)"
              printf '%s\n' '# cPanel CloudLinux NodeJS selector - NE PAS SUPPRIMER' 'DirectoryIndex disabled' 'RewriteEngine On' > public/.htaccess
            fi
            cat public/.htaccess || true
            cat .htaccess || true
            mkdir -p "$HOME/acsc-data"
            npm ci --omit=dev || echo "::warning::npm ci fail via SSH - faire manuellement via cPanel Terminal"
            mkdir -p tmp
            touch tmp/restart.txt
            echo ">> restart.txt OK"
            if command -v cloudlinux-selector >/dev/null 2>&1; then
              cloudlinux-selector restart --json --interpreter nodejs --app-root "$HOME/${{ secrets.O2SWITCH_PATH }}" || true
            fi

      - name: Post-deploy info
        run: |
          echo "=== FTP deploy termine ==="
          echo "Si SSH a timeout c'est NORMAL (SSH ferme sur o2switch mutualise)"
          echo "Si package.json a change : cPanel Terminal :"
          echo "  cd ~/${{ secrets.O2SWITCH_PATH }} && source ~/nodevenv/${{ secrets.O2SWITCH_PATH }}/22/bin/activate && npm ci --omit=dev && touch tmp/restart.txt"
          echo "Ou cPanel > Setup Node.js App > Run NPM Install > Restart"
