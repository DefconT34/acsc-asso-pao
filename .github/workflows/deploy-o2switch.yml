name: Deploy o2switch (SSH)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-o2switch
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check server.o2switch.js

  deploy:
    name: Deploy via SSH
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node for archive sanity check
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Validate secrets (diagnostic - ne leak jamais les valeurs)
        run: |
          echo "Host: $([ -n '${{ secrets.O2SWITCH_HOST }}' ] && echo SET || echo MISSING)"
          echo "User: $([ -n '${{ secrets.O2SWITCH_USER }}' ] && echo SET || echo MISSING)"
          echo "Password: $([ -n '${{ secrets.O2SWITCH_PASSWORD }}' ] && echo SET || echo EMPTY - normal si cle SSH)"
          echo "SSH_KEY: $([ -n '${{ secrets.O2SWITCH_SSH_KEY }}' ] && echo SET || echo EMPTY - normal si password)"
          echo "Port: ${{ secrets.O2SWITCH_PORT || '22 (default)' }}"
          echo "Path: ${{ secrets.O2SWITCH_PATH || 'MISSING !' }}"
          echo "NodeVenv: ${{ secrets.O2SWITCH_NODEVENV || '(vide - fallback auto)' }}"
          if [ -z "${{ secrets.O2SWITCH_HOST }}" ] || [ -z "${{ secrets.O2SWITCH_USER }}" ] || [ -z "${{ secrets.O2SWITCH_PATH }}" ]; then
            echo "::error::O2SWITCH_HOST / O2SWITCH_USER / O2SWITCH_PATH manquants - GitHub > Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.O2SWITCH_PASSWORD }}" ] && [ -z "${{ secrets.O2SWITCH_SSH_KEY }}" ]; then
            echo "::error::Ni O2SWITCH_PASSWORD ni O2SWITCH_SSH_KEY defini - configure l'un des deux (password = mot de passe cPanel)"
            exit 1
          fi

      # 1) Copie fichiers vers o2switch en SCP (sans node_modules/database.db/.env)
      # o2switch cPanel = auth password par defaut. Si tu utilises une cle SSH, renseigne O2SWITCH_SSH_KEY (laisse password vide).
      # appleboy/shuffle : si key est vide il ignore key et utilise password, et vice-versa.
      - name: SCP to o2switch
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          source: "server.js,server.o2switch.js,package.json,package-lock.json,public/**,.htaccess,ecosystem.config.example.js"
          target: "${{ secrets.O2SWITCH_PATH }}"
          overwrite: true
          strip_components: 0
          rm: false
          debug: true

      # 2) Sur le serveur : npm ci + restart Passenger
      - name: SSH - install & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          script: |
            set -e
            echo ">> PATH=${{ secrets.O2SWITCH_PATH }}"
            echo ">> NODEVENV=${{ secrets.O2SWITCH_NODEVENV }}"
            # Active l'env Node de l'app (obligatoire o2switch)
            if [ -n "${{ secrets.O2SWITCH_NODEVENV }}" ] && [ -f "${{ secrets.O2SWITCH_NODEVENV }}/bin/activate" ]; then
              source "${{ secrets.O2SWITCH_NODEVENV }}/bin/activate"
            elif [ -f "$HOME/nodevenv/${{ secrets.O2SWITCH_PATH }}/22/bin/activate" ]; then
              source "$HOME/nodevenv/${{ secrets.O2SWITCH_PATH }}/22/bin/activate"
            elif [ -f "/opt/alt/alt-nodejs22/enable" ]; then
              source /opt/alt/alt-nodejs22/enable
            fi
            node -v
            npm -v
            cd "${{ secrets.O2SWITCH_PATH }}"
            mkdir -p "$HOME/acsc-data"
            # Ne jamais ecraser la DB prod si elle est liee via DB_PATH
            npm ci --omit=dev
            mkdir -p tmp
            touch tmp/restart.txt
            echo ">> restart.txt touche - Passenger va redemarrer (10-20s)"
            # Alternative cPanel si dispo (ne bloque pas si echec)
            if command -v cloudlinux-selector >/dev/null 2>&1; then
              cloudlinux-selector restart --json --interpreter nodejs --app-root "$HOME/${{ secrets.O2SWITCH_PATH }}" || true
            fi
            sleep 3
            curl -sk https://127.0.0.1:${PORT:-3000}/api/health || curl -sk https://localhost:${PORT:-3000}/api/health || echo "health local skip"
            echo "Deploy OK - teste https://${{ secrets.O2SWITCH_HOST }}/api/health depuis l'exterieur"

