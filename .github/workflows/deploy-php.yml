name: Deploy PHP o2switch (FTP)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      clean:
        description: 'Vider acsc-asso-pao avant deploy (wipe complet)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-php
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: for f in api/*.php; do echo "lint $f"; php -l "$f"; done
      - run: php -l router.php
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci || npm install
      - run: npm run check || true
      - run: node --check public/sw.js || true

  deploy:
    name: Deploy via FTP
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5

      - name: Validate secrets
        run: |
          echo "Host: $([ -n '${{ secrets.O2SWITCH_HOST }}' ] && echo SET || echo MISSING)"
          echo "User: $([ -n '${{ secrets.O2SWITCH_USER }}' ] && echo SET || echo MISSING)"
          echo "Password: $([ -n '${{ secrets.O2SWITCH_PASSWORD }}' ] && echo SET || echo MISSING)"
          echo "Path: ${{ secrets.O2SWITCH_PATH || 'MISSING' }}"
          if [ -z "${{ secrets.O2SWITCH_HOST }}" ] || [ -z "${{ secrets.O2SWITCH_USER }}" ] || [ -z "${{ secrets.O2SWITCH_PATH }}" ]; then
            echo "::error::O2SWITCH_HOST / USER / PATH manquants"; exit 1; fi
          HOST='${{ secrets.O2SWITCH_HOST }}'
          if echo "$HOST" | grep -qE '^https?://|/|:'; then echo "::error::HOST invalide - IP/host nu SANS https:// ni :port"; exit 1; fi

      - name: Check DNS & SSH reachability
        run: |
          HOST='${{ secrets.O2SWITCH_HOST }}'
          echo "nslookup $HOST ..."
          nslookup "$HOST" 2>&1 || echo "::warning::DNS fail"
          echo "TCP 22/21 test ..."
          timeout 8 bash -c "cat < /dev/null > /dev/tcp/$HOST/22" && echo "TCP 22 OK" || echo "::warning::TCP 22 fail"
          timeout 8 bash -c "cat < /dev/null > /dev/tcp/$HOST/21" && echo "TCP 21 OK" || echo "::warning::TCP 21 fail"

      - name: Ensure .htaccess exists locally
        run: |
          ls -la .htaccess public/.htaccess || true
          if [ ! -f public/.htaccess ]; then mkdir -p public; printf '%s\n' '# cPanel CloudLinux' 'DirectoryIndex disabled' 'RewriteEngine On' > public/.htaccess; fi
          cat public/.htaccess; cat .htaccess || true; git ls-files | grep -E "htaccess" || true

      - name: Force full FTP republish (purge local cache)
        run: |
          rm -f .ftp-deploy-sync-state.json
          ls -la public/ | head -n 30 || true
          echo "git public files: $(git ls-files public | wc -l)"
          echo "commit msg: ${{ github.event.head_commit.message }}"
          echo "inputs.clean: ${{ inputs.clean }}"

      - name: Purge remote FTP sync cache (force full upload)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 15s
          command_timeout: 1m
          script: |
            set +e
            TARGET="${{ secrets.O2SWITCH_PATH }}"
            case "$TARGET" in /*) R0="$TARGET";; *) R0="$HOME/$TARGET";; esac
            R1="$HOME/$TARGET"
            R2="/home/koko6788/$TARGET"
            R3="/home2/koko6788/$TARGET"
            for R in "$R0" "$R1" "$R2" "$R3" "${{ secrets.O2SWITCH_PATH }}"; do
              rm -f "$R/.ftp-deploy-sync-state.json" 2>&1 || true
              echo "purged $R/.ftp-deploy-sync-state.json"
            done
            rm -f "$HOME/.ftp-deploy-sync-state.json" 2>&1 || true
            echo "remote .ftp-deploy-sync-state.json purged multi-home"

      - name: "WIPE acsc-asso-pao (vide le repertoire si [clean] dans commit ou clean=true)"
        if: contains(github.event.head_commit.message, '[clean]') || inputs.clean == true
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 20s
          command_timeout: 2m
          script: |
            set -e
            TARGET="${{ secrets.O2SWITCH_PATH }}"
            case "$TARGET" in /*) ROOT="$TARGET";; *) ROOT="$HOME/$TARGET";; esac
            ROOT2="/home/koko6788/$TARGET"
            ROOT3="/home2/koko6788/$TARGET"
            ROOTA="$HOME/$TARGET"
            echo ">> WIPE DEMANDE multi-home - TARGET=$TARGET ROOT=$ROOT ROOT2=$ROOT2 ROOT3=$ROOT3 ROOTA=$ROOTA HOME=$HOME"
            # backup config.local.php depuis n'importe quel HOME
            FOUND_CFG=""
            for R in "$ROOT" "$ROOT2" "$ROOT3" "$ROOTA"; do
              if [ -f "$R/api/config.local.php" ]; then
                cp -p "$R/api/config.local.php" /tmp/acsc_config.local.php.bak 2>&1 || true
                echo ">> backup api/config.local.php trouve dans $R -> /tmp/acsc_config.local.php.bak"
                ls -lh /tmp/acsc_config.local.php.bak || true
                FOUND_CFG="$R"
                break
              fi
            done
            if [ -z "$FOUND_CFG" ]; then
              echo ">> aucun api/config.local.php a sauvegarder"
              rm -f /tmp/acsc_config.local.php.bak 2>&1 || true
            fi
            for R in "$ROOT" "$ROOT2" "$ROOT3" "$ROOTA"; do
              # deduplicate
              if [ -z "$R" ] || [ "$R" = "/" ] || [ "$R" = "$HOME" ] || [ "$R" = "$HOME/" ]; then
                echo "!! SKIP WIPE ROOT invalide: $R"; continue; fi
              echo ">> AVANT WIPE - liste $R"
              ls -la "$R" 2>&1 | head -n 60 || echo "dossier inexistant/vide $R"
              du -sh "$R" 2>&1 | head -n 5 || true
              du -sh "$R"/public 2>&1 | head -n 5 || true
            done
            for R in "$ROOT" "$ROOT2" "$ROOT3" "$ROOTA"; do
              if [ -z "$R" ] || [ "$R" = "/" ] || [ "$R" = "$HOME" ] || [ "$R" = "$HOME/" ]; then continue; fi
              # evite double rm si meme chemin
              echo ">> SUPPRESSION rm -rf $R"
              rm -rf "$R" 2>&1 || true
              mkdir -p "$R" 2>&1 || true
              echo ">> APRES WIPE - vide $R"
              ls -la "$R" 2>&1 | head -n 20 || true
            done
            echo ">> WIPE OK multi-home - FTP + git fallback vont republier complet"

      - name: Deploy via FTP
        if: always()
        id: ftp_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          port: 21
          protocol: ftp
          security: loose
          local-dir: ./
          server-dir: ${{ secrets.O2SWITCH_PATH }}/
          log-level: verbose
          timeout: 300000
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/database.db
            **/database.db-*
            **/.env
            **/*.log
            **/template-neutre/**
            **/verify_*.js
            **/.ftp-deploy-sync-state.json
            **/api/config.local.php
            **/api/tmp/**
            **/old.yml

      - name: Deploy via SSH (git fallback - garantit public complet si FTP tronque a css/)
        if: always() && (contains(github.event.head_commit.message, '[clean]') || inputs.clean == true || steps.ftp_deploy.outcome == 'failure' || steps.ftp_deploy.outcome == 'cancelled')
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 20s
          command_timeout: 4m
          script: |
            set -e
            TARGET="${{ secrets.O2SWITCH_PATH }}"
            case "$TARGET" in /*) ROOT="$TARGET";; *) ROOT="$HOME/$TARGET";; esac
            ROOT2="/home/koko6788/$TARGET"
            ROOT3="/home2/koko6788/$TARGET"
            ROOTA="$HOME/$TARGET"
            ROOTS="$ROOT $ROOT2 $ROOT3 $ROOTA"
            ROOTS=$(echo "$ROOTS" | tr ' ' '\n' | awk '!seen[$0]++' | tr '\n' ' ')
            if ! command -v git >/dev/null 2>&1; then
              echo ">> git not found on host - fallback skip (FTP already success)"; exit 0;
            fi
            echo ">> GIT FALLBACK DEPLOY multi-home ROOTS=$ROOTS branch=${{ github.ref_name }}"
            for ROOT_LOOP in $ROOTS; do
              if [ -z "$ROOT_LOOP" ] || [ "$ROOT_LOOP" = "/" ] || [ "$ROOT_LOOP" = "$HOME" ]; then echo ">> SKIP git $ROOT_LOOP"; continue; fi
              echo ">> === FRESH GIT CLONE SUR $ROOT_LOOP ==="
              # backup .git if exists to speed? No, fresh wipe for clean
              rm -rf "$ROOT_LOOP" 2>&1 || true
              mkdir -p "$(dirname "$ROOT_LOOP")"
              # clone fresh
              BRANCH="${{ github.ref_name }}"
              echo ">> git clone $BRANCH -> $ROOT_LOOP"
              if ! git clone --depth=1 --branch "$BRANCH" https://github.com/${{ github.repository }}.git "$ROOT_LOOP" 2>&1; then
                echo ">> clone $BRANCH failed, try main"
                git clone --depth=1 --branch main https://github.com/${{ github.repository }}.git "$ROOT_LOOP" 2>&1 || git clone --depth=1 https://github.com/${{ github.repository }}.git "$ROOT_LOOP" 2>&1 || echo "::warning:: git clone all failed $ROOT_LOOP"
              fi
              if [ -d "$ROOT_LOOP/.git" ]; then
                cd "$ROOT_LOOP"
                git log -1 --oneline 2>&1 || true
                echo ">> HEAD $(git rev-parse --short HEAD 2>&1)"
              fi
              echo ">> ls $ROOT_LOOP"
              ls -la "$ROOT_LOOP" 2>&1 | head -n 40 || true
              echo ">> public + api + htaccess sur $ROOT_LOOP"
              ls -la "$ROOT_LOOP/public" 2>&1 | head -n 60 || true
              ls -la "$ROOT_LOOP/api" 2>&1 | head -n 40 || true
              cat "$ROOT_LOOP/public/version.txt" 2>&1 | head -n 10 || true
              cat "$ROOT_LOOP/.htaccess" 2>&1 | head -n 30 || true
              # Ensure perms correct immediately after clone
              chmod 755 "$ROOT_LOOP" 2>&1 || true
              chmod 755 "$ROOT_LOOP/public" 2>&1 || true
              find "$ROOT_LOOP/public" -type d -exec chmod 755 {} \; 2>&1 || true
              find "$ROOT_LOOP/public" -type f -exec chmod 644 {} \; 2>&1 || true
              chmod 644 "$ROOT_LOOP/.htaccess" 2>&1 || true
              chmod 644 "$ROOT_LOOP/public/.htaccess" 2>&1 || true
            done
            echo ">> GIT FALLBACK OK multi-home fresh clone - $(date -u +%FT%TZ)"

      - name: Restore config.local.php after WIPE (si backup existe)
        if: always() && (contains(github.event.head_commit.message, '[clean]') || inputs.clean == true)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 15s
          command_timeout: 1m
          script: |
            set +e
            TARGET="${{ secrets.O2SWITCH_PATH }}"
            case "$TARGET" in /*) ROOT="$TARGET";; *) ROOT="$HOME/$TARGET";; esac
            ROOT2="/home/koko6788/$TARGET"
            ROOT3="/home2/koko6788/$TARGET"
            ROOTA="$HOME/$TARGET"
            echo ">> RESTORE config.local.php check multi-home"
            if [ -f /tmp/acsc_config.local.php.bak ]; then
              for R in "$ROOT" "$ROOT2" "$ROOT3" "$ROOTA"; do
                if [ -z "$R" ] || [ "$R" = "/" ] || [ "$R" = "$HOME" ]; then continue; fi
                mkdir -p "$R/api" 2>&1 || true
                if [ ! -f "$R/api/config.local.php" ]; then
                  cp /tmp/acsc_config.local.php.bak "$R/api/config.local.php" 2>&1 || true
                  chmod 644 "$R/api/config.local.php" 2>&1 || true
                  echo ">> config.local.php restaure vers $R/api/config.local.php"
                else
                  echo ">> config.local.php existe deja dans $R - backup conserve en /tmp"
                fi
                ls -lh "$R/api/config.local.php" 2>&1 | head -n 5 || true
              done
              cat /tmp/acsc_config.local.php.bak 2>&1 | head -n 20 || true
            else
              echo ">> aucun backup /tmp/acsc_config.local.php.bak"
              for R in "$ROOT" "$ROOT2" "$ROOT3" "$ROOTA"; do
                if [ -f "$R/api/config.local.example.php" ]; then
                  echo ">> exemple dispo dans $R: cp api/config.local.example.php -> api/config.local.php puis editer DB koko6788_acsc"
                fi
                ls -la "$R/api/" 2>&1 | head -n 20 || true
              done
            fi

      - name: Fix permissions 0755 public (o2switch chmod)
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 15s
          command_timeout: 2m
          script: |
            set +e
            TARGET="${{ secrets.O2SWITCH_PATH }}"
            case "$TARGET" in /*) ROOT="$TARGET";; *) ROOT="$HOME/$TARGET";; esac
            ROOT2="/home2/koko6788/$TARGET"
            ROOT3="/home/koko6788/$TARGET"
            ROOTA="$HOME/$TARGET"
            echo ">> FIX PERMS 0755 public + htaccess - publier tous fichiers - multi HOME - $(date -u +%FT%TZ) HOME=$HOME"
            # Ensure parent dirs are traversable (o2switch HOME may be 0750)
            chmod 755 "$HOME" 2>&1 || true
            chmod 755 "/home/koko6788" 2>&1 || true
            chmod 755 "/home2/koko6788" 2>&1 || true
            for R in "$ROOT" "$ROOT2" "$ROOT3" "$ROOTA"; do
              [ -d "$R" ] || continue
              echo ">> R=$R"
              chmod 755 "$R" 2>&1 || true
              chmod 755 "$R/public" 2>&1 || true
              find "$R/public" -type d -exec chmod 755 {} \; 2>&1 || true
              find "$R/public" -type f -exec chmod 644 {} \; 2>&1 || true
              chmod 644 "$R/.htaccess" 2>&1 || true
              chmod 644 "$R/public/.htaccess" 2>&1 || true
              chmod 644 "$R/api/diag.php" 2>&1 || true
              ls -ld "$R" "$R/public" "$R/.htaccess" "$R/public/.htaccess" "$R/public/version.txt" "$R/public/index.html" 2>&1 || true
              cat "$R/public/version.txt" 2>&1 | head -n 20 || true
              ls -la "$R/public/" 2>&1 | head -n 60 || true
              echo ">> PERMS FIX DONE R=$R"
            done
            ls -la "$HOME" 2>&1 | head -n 40 || true
            ls -la "/home/koko6788" 2>&1 | head -n 40 || true
            ls -la "/home2/koko6788" 2>&1 | head -n 40 || true
      - name: SSH verify after deploy (best-effort)
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 15s
          command_timeout: 2m
          script: |
            set +e
            TARGET="${{ secrets.O2SWITCH_PATH }}"
            case "$TARGET" in /*) ROOT="$TARGET";; *) ROOT="$HOME/$TARGET";; esac
            ROOT2="/home/koko6788/$TARGET"
            ROOT3="/home2/koko6788/$TARGET"
            ROOTA="$HOME/$TARGET"
            echo ">> VERIF APRES DEPLOY multi-home HOME=$HOME TARGET=$TARGET"
            echo ">> HOME listing"
            ls -la "$HOME" 2>&1 | head -n 50 || true
            ls -la "/home/koko6788" 2>&1 | head -n 50 || true
            ls -la "/home2/koko6788" 2>&1 | head -n 50 || true
            for R in "$ROOT" "$ROOT2" "$ROOT3" "$ROOTA"; do
              echo ">> LS $R"
              ls -la "$R" 2>&1 | head -n 40 || echo "missing $R"
              echo ">> public $R/public"
              ls -la "$R/public" 2>&1 | head -n 40 || echo "no public $R"
              echo ">> api $R/api"
              ls -la "$R/api" 2>&1 | head -n 40 || echo "no api $R"
              cat "$R/.htaccess" 2>&1 | head -n 25 || echo "no .htaccess $R"
              cat "$R/public/.htaccess" 2>&1 | head -n 20 || echo "no public htaccess $R"
              cat "$R/public/version.txt" 2>&1 | head -n 10 || echo "no version $R"
            done

      - name: SSH verify public/version + api/health quick
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 15s
          command_timeout: 2m
          script: |
            set +e
            TARGET="${{ secrets.O2SWITCH_PATH }}"
            case "$TARGET" in /*) ROOT="$TARGET";; *) ROOT="$HOME/$TARGET";; esac
            ROOT2="/home/koko6788/$TARGET"
            ROOT3="/home2/koko6788/$TARGET"
            ROOTA="$HOME/$TARGET"
            echo ">> VERSION + PUBLIC multi-home HOME=$HOME TARGET=$TARGET"
            for R in "$ROOT" "$ROOT2" "$ROOT3" "$ROOTA"; do
              echo ">> --- $R ---"
              if [ -d "$R" ]; then
                echo ">> VERSION $R"
                cat "$R/public/version.txt" 2>&1 | head -n 20 || echo "no version.txt $R"
                echo ">> public file count $R"
                find "$R/public" -type f 2>&1 | wc -l || true
                find "$R/public" -maxdepth 2 -type f 2>&1 | head -n 40 || true
                echo ">> htaccess $R"
                cat "$R/.htaccess" 2>&1 | head -n 25 || echo "no .htaccess $R"
                cat "$R/public/.htaccess" 2>&1 | head -n 20 || echo "no public htaccess $R"
                echo ">> perms $R"
                ls -ld "$R" "$R/public" "$R/.htaccess" 2>&1 | head -n 10 || true
                echo ">> api health local (php) $R"
                php -l "$R/api/health.php" 2>&1 || true
                php "$R/api/health.php" 2>&1 | head -n 30 || echo "health php exec skip $R"
              else
                echo ">> MISSING $R"
              fi
            done

      - name: Post-deploy info
        if: always()
        run: |
          echo "=== Deploy PHP termine ==="
          echo "FTP outcome: ${{ steps.ftp_deploy.outcome }}"
          echo "Commit msg: ${{ github.event.head_commit.message }}"
          echo "Verifie: https://tondomaine/public/version.txt -> 2026-10-15T12:22Z"
          echo "Puis https://tondomaine/api/health -> {ok:1,version:9.0-php,dialect:mysql} ou 500 MySQL"
          echo "Si 500 -> cPanel > MySQL koko6788_acsc + phpMyAdmin sql/schema.mysql.sql + api/config.local.php"
