name: Deploy PHP o2switch (FTP)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      clean:
        description: 'Vider acsc-asso-pao avant deploy (wipe complet)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-php
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: for f in api/*.php; do echo "lint $f"; php -l "$f"; done
      - run: php -l router.php
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci || npm install
      - run: npm run check || true
      - run: node --check public/sw.js || true

  deploy:
    name: Deploy via FTP
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5

      - name: Validate secrets
        run: |
          echo "Host: $([ -n '${{ secrets.O2SWITCH_HOST }}' ] && echo SET || echo MISSING)"
          echo "User: $([ -n '${{ secrets.O2SWITCH_USER }}' ] && echo SET || echo MISSING)"
          echo "Password: $([ -n '${{ secrets.O2SWITCH_PASSWORD }}' ] && echo SET || echo MISSING)"
          echo "Path: ${{ secrets.O2SWITCH_PATH || 'MISSING' }}"
          if [ -z "${{ secrets.O2SWITCH_HOST }}" ] || [ -z "${{ secrets.O2SWITCH_USER }}" ] || [ -z "${{ secrets.O2SWITCH_PATH }}" ]; then
            echo "::error::O2SWITCH_HOST / USER / PATH manquants"; exit 1; fi
          HOST='${{ secrets.O2SWITCH_HOST }}'
          if echo "$HOST" | grep -qE '^https?://|/|:'; then echo "::error::HOST invalide - IP/host nu SANS https:// ni :port"; exit 1; fi

      - name: Check DNS & SSH reachability
        run: |
          HOST='${{ secrets.O2SWITCH_HOST }}'
          echo "nslookup $HOST ..."
          nslookup "$HOST" 2>&1 || echo "::warning::DNS fail"
          echo "TCP 22/21 test ..."
          timeout 8 bash -c "cat < /dev/null > /dev/tcp/$HOST/22" && echo "TCP 22 OK" || echo "::warning::TCP 22 fail"
          timeout 8 bash -c "cat < /dev/null > /dev/tcp/$HOST/21" && echo "TCP 21 OK" || echo "::warning::TCP 21 fail"

      - name: Ensure .htaccess exists locally
        run: |
          ls -la .htaccess public/.htaccess || true
          if [ ! -f public/.htaccess ]; then mkdir -p public; printf '%s\n' '# cPanel CloudLinux' 'DirectoryIndex disabled' 'RewriteEngine On' > public/.htaccess; fi
          cat public/.htaccess; cat .htaccess || true; git ls-files | grep -E "htaccess" || true

      - name: Force full FTP republish (purge local cache)
        run: |
          rm -f .ftp-deploy-sync-state.json
          ls -la public/ | head -n 30 || true
          echo "git public files: $(git ls-files public | wc -l)"
          echo "commit msg: ${{ github.event.head_commit.message }}"
          echo "inputs.clean: ${{ inputs.clean }}"

      - name: Purge remote FTP sync cache (force full upload)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 15s
          command_timeout: 1m
          script: |
            set +e
            rm -f "${{ secrets.O2SWITCH_PATH }}/.ftp-deploy-sync-state.json" 2>&1 || true
            rm -f "$HOME/${{ secrets.O2SWITCH_PATH }}/.ftp-deploy-sync-state.json" 2>&1 || true
            echo "remote .ftp-deploy-sync-state.json purged"

      - name: "WIPE acsc-asso-pao (vide le repertoire si [clean] dans commit ou clean=true)"
        if: contains(github.event.head_commit.message, '[clean]') || inputs.clean == true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 20s
          command_timeout: 2m
          script: |
            set -e
            TARGET="${{ secrets.O2SWITCH_PATH }}"
            if [[ "$TARGET" = /* ]]; then ROOT="$TARGET"; else ROOT="$HOME/$TARGET"; fi
            echo ">> WIPE DEMANDE - ROOT=$ROOT TARGET=$TARGET"
            if [ -z "$ROOT" ] || [ "$ROOT" = "/" ] || [ "$ROOT" = "$HOME" ] || [ "$ROOT" = "$HOME/" ]; then
              echo "!! REFUS WIPE ROOT invalide: $ROOT"; exit 1; fi
            if [ -f "$ROOT/api/config.local.php" ]; then
              cp "$ROOT/api/config.local.php" /tmp/acsc_config.local.php.bak
              echo ">> backup api/config.local.php -> /tmp/acsc_config.local.php.bak"
              ls -lh /tmp/acsc_config.local.php.bak || true
            else
              echo ">> aucun api/config.local.php a sauvegarder"
              rm -f /tmp/acsc_config.local.php.bak
            fi
            echo ">> AVANT WIPE - liste"
            ls -la "$ROOT" 2>&1 | head -n 60 || echo "dossier inexistant/vide"
            du -sh "$ROOT" 2>&1 | head -n 5 || true
            du -sh "$ROOT"/public 2>&1 | head -n 5 || true
            echo ">> SUPPRESSION rm -rf $ROOT"
            rm -rf "$ROOT" 2>&1
            mkdir -p "$ROOT"
            echo ">> APRES WIPE - vide"
            ls -la "$ROOT" 2>&1
            echo ">> WIPE OK - FTP + git fallback vont republier complet"

      - name: Deploy via FTP
        id: ftp_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          port: 21
          protocol: ftp
          security: loose
          local-dir: ./
          server-dir: ${{ secrets.O2SWITCH_PATH }}/
          log-level: verbose
          timeout: 300000
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/database.db
            **/database.db-*
            **/.env
            **/*.log
            **/template-neutre/**
            **/verify_*.js
            **/.ftp-deploy-sync-state.json
            **/api/config.local.php
            **/api/tmp/**
            **/old.yml

      - name: Deploy via SSH (git fallback - garantit public complet si FTP tronque a css/)
        if: always() && (contains(github.event.head_commit.message, '[clean]') || inputs.clean == true || steps.ftp_deploy.outcome == 'failure' || steps.ftp_deploy.outcome == 'cancelled')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 20s
          command_timeout: 4m
          script: |
            set -e
            TARGET="${{ secrets.O2SWITCH_PATH }}"
            if [[ "$TARGET" = /* ]]; then ROOT="$TARGET"; else ROOT="$HOME/$TARGET"; fi
            echo ">> GIT FALLBACK DEPLOY ROOT=$ROOT branch=${{ github.ref_name }}"
            mkdir -p "$ROOT"
            cd "$ROOT"
            git config --global --add safe.directory "$ROOT" 2>/dev/null || true
            if [ ! -d .git ]; then
              echo ">> init git"
              git init
              git remote add origin https://github.com/${{ github.repository }}.git 2>/dev/null || git remote set-url origin https://github.com/${{ github.repository }}.git
            else
              git remote set-url origin https://github.com/${{ github.repository }}.git 2>/dev/null || git remote add origin https://github.com/${{ github.repository }}.git
            fi
            BRANCH="${{ github.ref_name }}"
            echo ">> fetch $BRANCH"
            git fetch origin "$BRANCH" --depth=1 || git fetch origin main --depth=1 || git fetch origin master --depth=1
            if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
              echo ">> checkout $BRANCH"
              git checkout -B "$BRANCH" "origin/$BRANCH"
              git reset --hard "origin/$BRANCH"
            elif git show-ref --verify --quiet refs/remotes/origin/main; then
              echo ">> fallback main"
              git checkout -B main origin/main
              git reset --hard origin/main
            else
              echo ">> fallback master"
              git checkout -B master origin/master
              git reset --hard origin/master
            fi
            git clean -fd || true
            echo ">> HEAD $(git rev-parse --short HEAD) $(git log -1 --oneline)"
            ls -la | head -n 40
            echo ">> public + api"
            ls -la public/ | head -n 60
            ls -la api/ | head -n 40
            cat public/version.txt || true
            cat .htaccess | head -n 20 || true
            echo ">> GIT FALLBACK OK - $(date -u +%FT%TZ)"

      - name: Restore config.local.php after WIPE (si backup existe)
        if: always() && (contains(github.event.head_commit.message, '[clean]') || inputs.clean == true)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 15s
          command_timeout: 1m
          script: |
            set +e
            TARGET="${{ secrets.O2SWITCH_PATH }}"
            if [[ "$TARGET" = /* ]]; then ROOT="$TARGET"; else ROOT="$HOME/$TARGET"; fi
            echo ">> RESTORE config.local.php check"
            if [ -f /tmp/acsc_config.local.php.bak ]; then
              mkdir -p "$ROOT/api"
              if [ ! -f "$ROOT/api/config.local.php" ]; then
                cp /tmp/acsc_config.local.php.bak "$ROOT/api/config.local.php"
                echo ">> config.local.php restaure depuis backup"
              else
                echo ">> config.local.php existe deja - backup conserve en /tmp"
              fi
              ls -lh "$ROOT/api/config.local.php" 2>&1 || true
              cat "$ROOT/api/config.local.php" 2>&1 | head -n 20 || true
            else
              echo ">> aucun backup /tmp/acsc_config.local.php.bak"
              if [ -f "$ROOT/api/config.local.example.php" ]; then
                echo ">> exemple dispo: cp api/config.local.example.php -> api/config.local.php puis editer DB koko6788_acsc"
              fi
              ls -la "$ROOT/api/" 2>&1 | head -n 20 || true
            fi

      - name: SSH verify after deploy (best-effort)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 15s
          command_timeout: 2m
          script: |
            set +e
            echo ">> VERIF APRES DEPLOY"
            ls -la "${{ secrets.O2SWITCH_PATH }}/" 2>&1 | head -n 40 || ls -la "$HOME/${{ secrets.O2SWITCH_PATH }}/" 2>&1 | head -n 40 || true
            echo ">> public + api + htaccess"
            ls -la "${{ secrets.O2SWITCH_PATH }}/public/" 2>&1 | head -n 40 || ls -la "$HOME/${{ secrets.O2SWITCH_PATH }}/public/" 2>&1 | head -n 40 || true
            ls -la "${{ secrets.O2SWITCH_PATH }}/api/" 2>&1 | head -n 40 || ls -la "$HOME/${{ secrets.O2SWITCH_PATH }}/api/" 2>&1 | head -n 40 || true
            cat "${{ secrets.O2SWITCH_PATH }}/public/.htaccess" 2>&1 | head -n 20 || cat "$HOME/${{ secrets.O2SWITCH_PATH }}/public/.htaccess" 2>&1 | head -n 20 || true

      - name: SSH verify public/version + api/health quick
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: ${{ secrets.O2SWITCH_PORT || 22 }}
          timeout: 15s
          command_timeout: 2m
          script: |
            set +e
            TARGET="${{ secrets.O2SWITCH_PATH }}"
            if [[ "$TARGET" = /* ]]; then ROOT="$TARGET"; else ROOT="$HOME/$TARGET"; fi
            echo ">> VERSION + PUBLIC"
            cat "$ROOT/public/version.txt" 2>&1
            echo ">> public file count"
            find "$ROOT/public" -type f | wc -l
            find "$ROOT/public" -maxdepth 2 -type f 2>&1 | head -n 40 || true
            echo ">> htaccess"
            cat "$ROOT/.htaccess" 2>&1 | head -n 25
            cat "$ROOT/public/.htaccess" 2>&1 | head -n 20
            echo ">> api health local (php)"
            php -l "$ROOT/api/health.php" 2>&1 || true
            php "$ROOT/api/health.php" 2>&1 | head -n 30 || echo "health php exec skip"

      - name: Post-deploy info
        if: always()
        run: |
          echo "=== Deploy PHP termine ==="
          echo "FTP outcome: ${{ steps.ftp_deploy.outcome }}"
          echo "Commit msg: ${{ github.event.head_commit.message }}"
          echo "Verifie: https://tondomaine/public/version.txt -> 2026-10-13T13:30Z"
          echo "Puis https://tondomaine/api/health -> {ok:1,version:9.0-php,dialect:mysql} ou 500 MySQL"
          echo "Si 500 -> cPanel > MySQL koko6788_acsc + phpMyAdmin sql/schema.mysql.sql + api/config.local.php"
